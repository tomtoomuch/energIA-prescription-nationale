<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergIA — Moteur prescriptif</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
            #assistant-section {
             border-top: 1px solid #334155;
              width: 80% !important;
              background: #fff!important;
              margin: 0 auto!important;
              color: #000!important;
              padding: 20px!important;
              margin-bottom: 40px!important;
              }
      .assistant-summary-grid {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(160px, 1fr)
        );
        gap: 10px;
      }

      .assistant-summary-item {
        padding: 12px;
        border-radius: 8px;
        background: #0f172a;
      }

      .assistant-summary-label {
        display: block;
        margin-bottom: 5px;
        color: #94a3b8;
        font-size: 12px;
      }

      .assistant-summary-value {
        color: #e2e8f0;
        font-size: 16px;
        font-weight: 600;
      }

      .assistant-summary-title {
        margin-bottom: 10px;
        color: #93c5fd;
        font-weight: 600;
      }

      .assistant-status-ok {
        color: #86efac;
      }

      .assistant-status-warn {
        color: #fdba74;
      }
      #assistant-section h2 {
        font-size: 16px;
        margin: 0 0 6px;
      }

      #assistant-question {
        width: 100%;
        min-height: 80px;
        padding: 10px;
        border: 1px solid #334155;
        border-radius: 8px;
        resize: vertical;
        background: #1e293b;
        color: #e2e8f0;
        font-family: inherit;
        font-size: 14px;
      }

      #assistant-button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #assistant-error {
        min-height: 18px;
        margin-top: 8px;
        color: #f87171;
        font-size: 13px;
      }

      #assistant-process,
      #assistant-data,
      #assistant-answer {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #1e293b;
        font-size: 13px;
      }

      #assistant-process {
        color: #93c5fd;
      }

      #assistant-data {
        overflow-x: auto;
        color: #cbd5e1;
        white-space: pre-wrap;
      }

      #assistant-answer {
        background: #14532d;
        color: #bbf7d0;
        line-height: 1.5;
      }

      .assistant-step {
        margin: 5px 0;
      }


      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      #app { display: flex; height: 100vh; }
      #sidebar { width: 360px; padding: 20px; background: #111827; overflow-y: auto; border-right: 1px solid #1f2937; }
      #map { flex: 1; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.subtitle { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
      label { display: block; font-size: 13px; margin: 12px 0 4px; color: #cbd5e1; }
      select, input {
        width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155;
        background: #1e293b; color: #e2e8f0; font-size: 14px;
      }
      button {
        width: 100%; margin-top: 16px; padding: 10px; border: none; border-radius: 8px;
        background: #3b82f6; color: white; font-weight: 600; cursor: pointer; font-size: 14px;
      }
      button:hover { background: #2563eb; }
      #error-box { color: #f87171; font-size: 13px; margin-top: 8px; min-height: 16px; }
      #results { margin-top: 20px; }
      .status { padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
      .status.ok { background: #14532d; color: #86efac; }
      .status.warn { background: #7c2d12; color: #fdba74; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #1f2937; }
      th { color: #94a3b8; font-weight: 500; }
      .legend { display: flex; gap: 10px; margin-top: 16px; font-size: 11px; color: #94a3b8; flex-wrap: wrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    </style>
  </head>
  
  <body>
    
    <section id="assistant-section">
      <h2>Assistant energIA</h2>

      <p class="subtitle">
        Posez une question à partir des données EnergIA
      </p>

      <form id="assistant-form">
        <label for="assistant-question">
          Question
        </label>

        <textarea
          id="assistant-question"
          placeholder="consommation occitanie 18:00"
          required
        >consommation occitanie 18:00</textarea>

        <button
          id="assistant-button"
          type="submit"
        >
          Envoyer la question
        </button>
      </form>

      <div id="assistant-error"></div>

      <div id="assistant-process" hidden>
        
      </div>
      <div
        id="assistant-data"
        hidden
      ></div>

      <div
        id="assistant-answer"
        hidden
      ></div>
    </section>

    <section>
      <div id="app">
        <div id="sidebar">
          <h1>EnergIA</h1>
          <p class="subtitle">Répartition prescriptive régoinale de la production nucléaire en France</p>

          <form id="sim-form">
            <label for="region-select">Région en surconsommation</label>
            <select id="region-select" required>
              <option value="" disabled selected>Choisir une région...</option>
            </select>

            <label for="demand-input">Hausse de consommation (MW)</label>
            <input id="demand-input" type="number" min="1" step="1" placeholder="ex: 500" required />

            <button type="submit">Lancer la simulation</button>
          </form>
          <div id="error-box"></div>

          <div class="legend">
            <span><span class="dot" style="background:#22c55e"></span>Marge confortable</span>
            <span><span class="dot" style="background:#f59e0b"></span>Charge élevée</span>
            <span><span class="dot" style="background:#ef4444"></span>Presque saturée</span>
            <span><span class="dot" style="background:#9ca3af"></span>Indisponible</span>
          </div>

          <div id="results"></div>
        </div>

        <div id="map"></div>
      
      </div>
    </section>
    

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>
        function formatNumber(value) {
    if (
      value === null ||
      value === undefined ||
      Number.isNaN(Number(value))
    ) {
      return "non disponible";
    }

    return new Intl.NumberFormat(
      "fr-FR",
      {
        maximumFractionDigits: 2,
      }
    ).format(Number(value));
  }


  function formatBoolean(
    value,
    trueText = "oui",
    falseText = "non"
  ) {
    if (value === true) {
      return trueText;
    }

    if (value === false) {
      return falseText;
    }

    return "non disponible";
  }


  function summaryItem(
    label,
    value,
    cssClass = ""
  ) {
    return `
      <div class="assistant-summary-item">
        <span class="assistant-summary-label">
          ${label}
        </span>

        <span class="assistant-summary-value ${cssClass}">
          ${value}
        </span>
      </div>
    `;
  }


  function renderConsumptionData(data) {
    return `
      <div class="assistant-summary-title">
        consommation de référence
      </div>

      <div class="assistant-summary-grid">
        ${summaryItem(
          "région",
          data.region_id || "non disponible"
        )}

        ${summaryItem(
          "heure",
          data.timestamp || "non disponible"
        )}

        ${summaryItem(
          "consommation",
          `${formatNumber(
            data.consumption_mw
          )} MW`
        )}
      </div>
    `;
  }


  function renderSimulationData(data) {
    const scenarioId = (
      data.scenario?.scenario_id ||
      data.scenario?.id ||
      "non disponible"
    );

    const constraintsClass = (
      data.all_constraints_respected
        ? "assistant-status-ok"
        : "assistant-status-warn"
    );

    const demandClass = (
      data.all_demand_satisfied
        ? "assistant-status-ok"
        : "assistant-status-warn"
    );

    const reserveClass = (
      data.reserve_always_sufficient
        ? "assistant-status-ok"
        : "assistant-status-warn"
    );

    return `
      <div class="assistant-summary-title">
        résumé de la simulation phase 3
      </div>

      <div class="assistant-summary-grid">
        ${summaryItem(
          "phase",
          data.phase ?? "non disponible"
        )}

        ${summaryItem(
          "scénario",
          scenarioId
        )}

        ${summaryItem(
          "nombre de pas",
          data.steps_count ?? "non disponible"
        )}

        ${summaryItem(
          "durée d’un pas",
          `${formatNumber(
            data.step_minutes
          )} minutes`
        )}

        ${summaryItem(
          "consommation totale",
          `${formatNumber(
            data.total_consumption_mw
          )} MW`
        )}

        ${summaryItem(
          "production solaire",
          `${formatNumber(
            data.total_solar_production_mw
          )} MW`
        )}

        ${summaryItem(
          "production éolienne",
          `${formatNumber(
            data.total_wind_production_mw
          )} MW`
        )}

        ${summaryItem(
          "production non pilotable",
          `${formatNumber(
            data.total_non_dispatchable_production_mw
          )} MW`
        )}

        ${summaryItem(
          "demande résiduelle",
          `${formatNumber(
            data.total_residual_demand_mw
          )} MW`
        )}

        ${summaryItem(
          "puissance manquante",
          `${formatNumber(
            data.total_missing_mw
          )} MW`,
          demandClass
        )}

        ${summaryItem(
          "contraintes respectées",
          formatBoolean(
            data.all_constraints_respected
          ),
          constraintsClass
        )}

        ${summaryItem(
          "réserve toujours suffisante",
          formatBoolean(
            data.reserve_always_sufficient
          ),
          reserveClass
        )}

        ${summaryItem(
          "nombre d’événements",
          data.events_count ?? 0
        )}

        ${summaryItem(
          "variation totale des événements",
          `${formatNumber(
            data.total_event_delta_mw
          )} MW`
        )}
      </div>
    `;
  }


  function renderPlantsData(data) {
    const plants = Array.isArray(
      data.plants
    )
      ? data.plants
      : [];

    const availablePlants = plants.filter(
      (plant) => plant.available === true
    );

    const maximumPower = availablePlants.reduce(
      (total, plant) => (
        total +
        Number(
          plant.maximum_power_mw || 0
        )
      ),
      0
    );

    return `
      <div class="assistant-summary-title">
        résumé des centrales
      </div>

      <div class="assistant-summary-grid">
        ${summaryItem(
          "nombre de centrales",
          data.plants_count ??
          data.count ??
          plants.length
        )}

        ${summaryItem(
          "centrales disponibles",
          availablePlants.length,
          "assistant-status-ok"
        )}

        ${summaryItem(
          "puissance maximale disponible",
          `${formatNumber(
            maximumPower
          )} MW`
        )}
      </div>
    `;
  }


  function renderAssistantData(
    data,
    toolName
  ) {
    if (
      Array.isArray(data) &&
      data.length === 1
    ) {
      data = data[0];
    }

    if (
      !data ||
      typeof data !== "object"
    ) {
      return `
        <div class="assistant-summary-title">
          aucune donnée structurée disponible
        </div>
      `;
    }

    if (
      toolName === "get_consumption" ||
      data.consumption_mw !== undefined
    ) {
      return renderConsumptionData(
        data
      );
    }

    if (
      toolName === "simulate_phase3" ||
      data.phase === 3
    ) {
      return renderSimulationData(
        data
      );
    }

    if (
      toolName === "list_plants" ||
      Array.isArray(data.plants)
    ) {
      return renderPlantsData(
        data
      );
    }

    return `
      <div class="assistant-summary-title">
        résultat energIA disponible
      </div>
    `;
  }


  function renderAssistantResult(result) {
    const processBox = document.getElementById(
      "assistant-process"
    );

    const dataBox = document.getElementById(
      "assistant-data"
    );

    const answerBox = document.getElementById(
      "assistant-answer"
    );

    const steps = Array.isArray(
      result.steps
    )
      ? result.steps
      : [];

    const toolsUsed = Array.isArray(
      result.tools_used
    )
      ? result.tools_used
      : [];

    const toolName = (
      toolsUsed[0]?.name ||
      ""
    );

    processBox.innerHTML = `
      <strong>processus</strong>

      ${steps
        .map(
          (step) => `
            <div class="assistant-step">
              ✓ ${step}
            </div>
          `
        )
        .join("")}
    `;

    dataBox.innerHTML = renderAssistantData(
      result.data,
      toolName
    );

    answerBox.innerHTML = "";

    const answerTitle = document.createElement(
      "strong"
    );

    answerTitle.textContent = (
      "réponse gemma 4"
    );

    const answerText = document.createElement(
      "div"
    );

    answerText.textContent = (
      result.answer ||
      "aucune réponse disponible"
    );

    answerBox.appendChild(
      answerTitle
    );

    answerBox.appendChild(
      answerText
    );

    processBox.hidden = false;
    dataBox.hidden = false;
    answerBox.hidden = false;
  }
    </script>
</body>
</html>
