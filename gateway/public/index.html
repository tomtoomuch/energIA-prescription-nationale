<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergIA — Système d'Aide à la Décision</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  
  <body>
    <header id="welcome-section">
      
      <nav>
        <a href="#welcome-section">EnergIA</a>

        <a href="#ancre-assistant">Système d'Aide à la Décision</a>
        
        <a href="#ancre-app">Moteur prescriptif régional</a>
        
        
      </nav>

    </header>
  
    <main>
      
      <section id="ancre-assistant">
        
        <article id="assistant-section">
          <h2>Assistant energIA</h2>

          <form id="assistant-form">
            <label for="assistant-question">
              Saisissez votre question à EnergIA
            </label>

            <textarea
              id="assistant-question"
              placeholder="consommation occitanie 18:00"
              required
            >consommation occitanie 18:00</textarea>

            <button
              id="assistant-button"
              type="submit"
            >
              Envoyer la question
            </button>
          </form>

          <div id="assistant-error"></div>

          <div id="assistant-process" hidden></div>
          
          <div id="assistant-data" hidden></div>

          <div id="assistant-answer" hidden></div>
        </article>
      
      </section>

      <section id="ancre-app">
        <article id="app">
          <div id="sidebar">
            <h1>EnergIA</h1>
            <p class="subtitle">Répartition prescriptive régoinale de la production nucléaire en France</p>

            <form id="sim-form">
              <label for="region-select">Région en surconsommation</label>
              <select id="region-select" required>
                <option value="" disabled selected>Choisir une région...</option>
              </select>

              <label for="demand-input">Hausse de consommation (MW)</label>
              <input id="demand-input" type="number" min="1" step="1" placeholder="ex: 500" required />

              <button type="submit">Lancer la simulation</button>
            </form>
            <div id="error-box"></div>

            <div class="legend">
              <span><span class="dot" style="background:#22c55e"></span>Marge confortable</span>
              <span><span class="dot" style="background:#f59e0b"></span>Charge élevée</span>
              <span><span class="dot" style="background:#ef4444"></span>Presque saturée</span>
              <span><span class="dot" style="background:#9ca3af"></span>Indisponible</span>
            </div>

            <div id="results"></div>
          </div>

          <div id="map"></div>
        
        </article>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./input_checks.js"></script>
  
  </body>
</html>
