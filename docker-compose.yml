services:
  gateway:
    image: tomtoomuch/energia-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    env_file:
      - ./.env
    depends_on:
      - ms-python
      - ms-python-2
      - mcp-server
    restart: unless-stopped
    networks:
      - energia-net

  ms-python:
    image: tomtoomuch/energia-ms-python
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - energia-net

  ms-python-2:
    image: tomtoomuch/energia-ms-python-2
    ports:
      - "${PYTHON_PORT_2:-8002}:8002"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - energia-net

  llm:
    image: tomtoomuch/energia-llm
    ports:
      - "11434:11434"
    volumes:
      - ./llm:/root/.ollama
    pull_policy: always
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
      ollama serve & 
      sleep 5; 
      ollama run gemma4:e4b; 
      wait"
    networks:
      - energia-net
  mcp-server:
    image: tomtoomuch/energia-mcp-server
    ports:
      - "${MCP_PORT_3:-8003}:8003"
    env_file:
      - ./.env
    depends_on:
      - ms-python-2
      - llm
    restart: unless-stopped
    networks:
      - energia-net

networks:
  energia-net: