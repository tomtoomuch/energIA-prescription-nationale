services:
  gateway:
    image: tomtoomuch/energia-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    env_file:
      - ./.env
    depends_on:
      - ms-python
    restart: unless-stopped

  ms-python:
    image: tomtoomuch/energia-ms-python
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped

  ms-python-2:
    image: tomtoomuch/energia-ms-python-2
    ports:
      - "${PYTHON_PORT_2:-8002}:8002"
    env_file:
      - .env
    restart: unless-stopped

  llm:
    image: ollama/ollama:latest
    container_name: llm
    ports:
      - "11434:11434"
    volumes:
      - ./llm:/root/.ollama
    restart: unless-stopped