services:

  gateway:
    depends_on:
      - prediction
      - training
  training:
    image: tomtoomuch/energia-training
    ports:
      - "${TRAINING_PORT:-8005}:8005"
    env_file:
      - ./.env
    volumes:
      - ./prediction-models:./models
    restart: unless-stopped
    networks:
      - energia-net

  prediction:
    image: tomtoomuch/energia-prediction
    ports:
      - "${PREDICTION_PORT:-8004}:8004"
    env_file:
      - ./.env
    volumes:
      - ./prediction-models:./models:ro
    depends_on:
      - training
    restart: unless-stopped
    networks:
      - energia-net

volumes:
  prediction-models:
